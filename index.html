<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YtToMp3 Pro - Final</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070f;color:#fff;font-family:Inter,sans-serif;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;animation:float 8s ease-in-out infinite;z-index:0}
.orb1{width:600px;height:600px;background:radial-gradient(circle,#ff2a6d55,#ff7a4555);top:-200px;left:-200px}
.orb2{width:500px;height:500px;background:radial-gradient(circle,#7c5cff55,#60a5fa55);top:40%;right:-150px;animation-delay:2s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}}
nav{max-width:1200px;margin:0 auto;padding:24px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10}
.logo{font-weight:800;font-size:20px;display:flex;gap:12px;align-items:center}
.logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#ff2a6d,#ff7a45);border-radius:12px;display:grid;place-items:center}
.nav-link{padding:10px 20px;border-radius:30px;background:linear-gradient(100deg,#7c5cff,#60a5fa);color:#fff;font-size:12px;font-weight:600;text-decoration:none}
.hero{max-width:1200px;margin:0 auto;padding:40px 20px;text-align:center;position:relative;z-index:10}
.badge{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border-radius:30px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px);font-size:11px;color:#aab1c7;margin-bottom:20px}
.hero h1{font-size:clamp(38px,7vw,72px);line-height:.9;letter-spacing:-3px;font-weight:800}
.hero h1 span{background:linear-gradient(100deg,#ff2a6d,#ff7a45,#ffd93d);-webkit-background-clip:text;color:transparent;background-size:200%;animation:gradient 4s ease infinite}
@keyframes gradient{0%{background-position:0%}100%{background-position:200%}}
.glass{max-width:760px;margin:30px auto;background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(30px);border-radius:28px;padding:10px}
.input-wrap{display:flex;gap:10px;background:rgba(0,0,0,0.4);border-radius:20px;padding:8px}
.input-wrap input{flex:1;background:transparent;border:none;color:#fff;padding:18px 20px;font-size:15px;outline:none}
.btn-c{background:linear-gradient(100deg,#ff2a6d,#ff7a45);border:none;padding:18px 32px;border-radius:16px;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(255,42,109,0.4)}
.result{max-width:760px;margin:20px auto;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(30px);border-radius:20px;padding:16px;display:none;position:relative;z-index:10}
.result.active{display:block;animation:pop .5s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes pop{from{transform:scale(.92) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.bar{height:8px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin:12px 0;display:none}.fill{height:100%;width:0%;background:linear-gradient(90deg,#ff2a6d,#ff7a45);transition:.4s}
.playlist{max-width:1200px;margin:30px auto;padding:0 20px;position:relative;z-index:10}
.top-actions{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.top-actions button{padding:12px 20px;border-radius:30px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(20px)}
.top-actions button.primary{background:white;color:#000}
.film-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
@media(max-width:600px){.film-grid{grid-template-columns:repeat(2,1fr);gap:12px}}
.film-card{position:relative;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(20px);border-radius:18px;overflow:hidden;transition:.4s;animation:fadeIn .5s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.film-card:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(255,42,109,0.3)}
.film-card.selected{border-color:#ff2a6d;background:rgba(255,42,109,0.12);box-shadow:0 0 30px rgba(255,42,109,0.3)}
.film-thumb{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:#000}
.film-thumb img{width:100%;height:100%;object-fit:cover;transition:.6s}
.film-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.8) 0%,transparent 60%)}
.film-overlay{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.3s;background:rgba(0,0,0,0.4)}
.film-card:hover .film-overlay{opacity:1}
.play-big{width:56px;height:56px;background:rgba(255,255,255,0.95);border-radius:50%;display:grid;place-items:center}
.check-badge{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,0.6);border:1.5px solid rgba(255,255,255,0.3);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:2}
.check-badge.active{background:#ff2a6d;border-color:#ff2a6d}
.film-info{padding:12px}
.film-info b{font-size:12px;line-height:1.3;display:block;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:32px}
.film-info span{font-size:10px;color:#939bb3;display:block;margin-top:4px}
.film-actions{display:flex;gap:6px;margin-top:10px}
.film-actions button{flex:1;padding:8px;border-radius:8px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.film-actions .btn-play{background:white;color:#000}
.film-actions .btn-down{background:linear-gradient(100deg,#ff2a6d,#ff7a45);color:#fff}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,12,20,0.95);border-top:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(40px);padding:14px 20px;display:none;z-index:30;align-items:center;gap:14px}
.player-bar.active{display:flex}
.status{font-size:9px;padding:3px 7px;border-radius:20px;background:rgba(255,255,255,0.08);color:#aab1c7;margin-left:6px}
.status.dl{background:rgba(255,210,50,0.15);color:#ffd93d}
.status.done{background:rgba(0,255,136,0.15);color:#00ff88}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div>
<nav><div class="logo"><div class="logo-icon"><i class="fa-solid fa-music"></i></div> YtToMp3 Pro</div><a href="https://subtitle-pro-rouge.vercel.app" target="_blank" class="nav-link">Subtitle Pro</a></nav>
<div class="hero">
<div class="badge">✨ FIXED VERSION - NO STUCK</div>
<h1>Playlist to MP3 <br><span>Select & Play.</span></h1>
<p style="color:#939bb3;margin-top:12px;font-size:14px">PL playlist paste කරාම පහලට රූපේ එක්ක පෙන්නනවා</p>
<div class="glass">
<div class="input-wrap">
<input id="urlInput" placeholder="Paste YouTube Playlist or Video link...">
<button class="btn-c" id="convertBtn">Load</button>
</div>
</div>
<div class="result" id="result">
<div class="bar" id="bar"><div class="fill" id="fill"></div></div>
<div id="log" style="font-size:12px;color:#aab1c7"></div>
</div>
</div>
<div class="playlist" id="playlist" style="display:none">
<div class="top-actions">
<button onclick="selectAll()">Select All</button>
<button onclick="deselectAll()">Deselect</button>
<button class="primary" onclick="downloadSelected()">Download Selected (<span id="selCount">0</span>)</button>
<button class="primary" onclick="playSelected()">Play in Site</button>
</div>
<div class="film-grid" id="list"></div>
</div>
<div class="player-bar" id="playerBar">
<img id="pThumb" src="" style="width:48px;height:48px;border-radius:10px;object-fit:cover">
<div style="flex:1;min-width:0"><b id="pTitle" style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></b><span style="font-size:11px;color:#939bb3">Now Playing</span></div>
<audio controls id="audio" style="flex:1"></audio>
<button style="width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;display:grid;place-items:center;cursor:pointer" onclick="playerBar.classList.remove('active')"><i class="fa-solid fa-xmark"></i></button>
</div>
<script>
let songs=[], selected=new Set();
const urlInput=document.getElementById('urlInput'), result=document.getElementById('result'), bar=document.getElementById('bar'), fill=document.getElementById('fill'), logEl=document.getElementById('log'), listEl=document.getElementById('list'), selCountEl=document.getElementById('selCount'), playerBar=document.getElementById('playerBar'), audio=document.getElementById('audio'), pThumb=document.getElementById('pThumb'), pTitle=document.getElementById('pTitle'), playlistEl=document.getElementById('playlist');
function getPlaylistId(u){const m=u.match(/[?&]list=([^&]+)/);return m?m[1]:null;}
function getVideoId(u){const m=u.match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);return m?m[1]:null;}
async function getDirectMp3Url(videoId){
 const url=`https://www.youtube.com/watch?v=${videoId}`;
 const apis=['https://api.cobalt.tools/api/json','https://co.wuk.sh/api/json'];
 for(let api of apis){try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,isAudioOnly:true,aFormat:'mp3'})}); const j=await r.json(); if(j.url) return j.url;}catch{}}
 return null;
}
async function downloadReal(videoId, title){
 const el=document.getElementById('status-'+videoId); if(el){el.textContent='Downloading...';el.className='status dl';}
 const mp3=await getDirectMp3Url(videoId);
 if(mp3){ if(el){el.textContent='Done';el.className='status done';} const a=document.createElement('a'); a.href=mp3; a.download=`${title}.mp3`; a.target='_blank'; document.body.appendChild(a); a.click(); a.remove();}
 else { if(el){el.textContent='Failed';} window.open(`https://api.vevioz.com/@api/button/mp3/${videoId}`,'_blank'); }
}
document.getElementById('convertBtn').onclick=async()=>{
 const url=urlInput.value.trim(); if(!url){alert('Link දාන්න');return;}
 let pid=getPlaylistId(url), vid=getVideoId(url);
 result.classList.add('active'); bar.style.display='block'; fill.style.width='15%'; listEl.innerHTML=''; selected.clear(); updateCount(); playlistEl.style.display='block';

 if(pid && pid.startsWith('RD')){
   logEl.textContent='Mix (RD) playlist - YouTube blocks full list. Showing video from mix...';
   fill.style.width='100%';
   if(vid){
     songs=[{id:vid,title:'Video from Mix Playlist',author:'YouTube Mix',thumb:`https://img.youtube.com/vi/${vid}/mqdefault.jpg`}];
     render(); return;
   } else {
     // Try to get video id from RD list itself if possible
     songs=[{id:pid.replace('RDL','').replace('RD','').substring(0,11),title:'Mix Video',author:'YouTube Mix',thumb:`https://img.youtube.com/vi/${pid.replace('RDL','').substring(0,11)}/mqdefault.jpg`}];
     render(); return;
   }
 }

 if(pid){
  logEl.textContent='Loading PL playlist...';
  fill.style.width='40%';
  try{
   const controller=new AbortController(); setTimeout(()=>controller.abort(),6000);
   const r=await fetch(`https://inv.nadeko.net/api/v1/playlists/${pid}`,{signal:controller.signal});
   if(r.ok){
     const j=await r.json();
     if(j.videos && j.videos.length>0){
       songs=j.videos.slice(0,80).map(v=>({id:v.videoId,title:v.title,author:v.author,thumb:`https://img.youtube.com/vi/${v.videoId}/mqdefault.jpg`}));
       fill.style.width='100%'; logEl.textContent=`✅ Found ${songs.length} songs - showing below with thumbnail`; render(); return;
     }
   }
  }catch(e){ console.log(e); }
  fill.style.width='100%';
  logEl.textContent='❌ Playlist API busy. Use this test PL link: https://www.youtube.com/playlist?list=PL4o29bINVT4EG_y-k5jGoOu3fbDDJ77x - Copy and paste it';
  return;
 }

 if(vid){
  songs=[{id:vid,title:'Single Video - Ready to Play & Download',author:'YouTube',thumb:`https://img.youtube.com/vi/${vid}/mqdefault.jpg`}];
  fill.style.width='100%'; logEl.textContent='✅ Single video loaded - showing below'; render();
 } else {
  logEl.textContent='Invalid link. Paste PL playlist or single video';
 }
};

function render(){
 listEl.innerHTML='';
 if(songs.length===0){listEl.innerHTML='<p style="text-align:center;color:#7a8196;padding:30px">No songs</p>';return;}
 songs.forEach((s,i)=>{
  const div=document.createElement('div'); div.className='film-card'; div.id='song-'+i; div.style.animationDelay=`${i*0.04}s`;
  div.innerHTML=`
   <div class="film-thumb">
    <img src="${s.thumb}" loading="lazy">
    <div class="check-badge" id="check-${i}" onclick="toggleSelect(${i})"><i class="fa-solid fa-check" style="font-size:11px;display:none"></i></div>
    <div class="film-overlay" onclick="playSong(${i})"><div class="play-big"><i class="fa-solid fa-play" style="color:#000;margin-left:2px"></i></div></div>
   </div>
   <div class="film-info">
    <b>${s.title}</b>
    <span>${s.author} <span class="status" id="status-${s.id}">Ready</span></span>
    <div class="film-actions">
     <button class="btn-play" onclick="playSong(${i})"><i class="fa-solid fa-play"></i> Play</button>
     <button class="btn-down" onclick="downloadOne(${i})"><i class="fa-solid fa-download"></i></button>
    </div>
   </div>`;
  listEl.appendChild(div);
 });
 window.scrollTo({top:playlistEl.offsetTop-80,behavior:'smooth'});
}
function toggleSelect(i){ if(selected.has(i))selected.delete(i); else selected.add(i); const c=document.getElementById('check-'+i), card=document.getElementById('song-'+i); if(selected.has(i)){c.classList.add('active');c.querySelector('i').style.display='block';card.classList.add('selected');}else{c.classList.remove('active');c.querySelector('i').style.display='none';card.classList.remove('selected');} updateCount(); }
function selectAll(){songs.forEach((_,i)=>selected.add(i)); document.querySelectorAll('.check-badge').forEach(c=>{c.classList.add('active');c.querySelector('i').style.display='block';}); document.querySelectorAll('.film-card').forEach(s=>s.classList.add('selected')); updateCount();}
function deselectAll(){selected.clear(); document.querySelectorAll('.check-badge').forEach(c=>{c.classList.remove('active');c.querySelector('i').style.display='none';}); document.querySelectorAll('.film-card').forEach(s=>s.classList.remove('selected')); updateCount();}
function updateCount(){selCountEl.textContent=selected.size;}
async function playSong(i){
 const s=songs[i]; pThumb.src=s.thumb; pTitle.textContent=s.title; playerBar.classList.remove('active'); void playerBar.offsetWidth; playerBar.classList.add('active'); logEl.textContent=`Loading ${s.title} in site player...`;
 const mp3=await getDirectMp3Url(s.id); if(mp3){audio.src=mp3; audio.play(); logEl.textContent=`▶️ Playing: ${s.title}`;} else { logEl.textContent='MP3 API busy, try download'; window.open(`https://www.youtube.com/watch?v=${s.id}`,'_blank'); }
}
async function downloadOne(i){ const s=songs[i]; await downloadReal(s.id,s.title); }
async function downloadSelected(){ if(selected.size===0){alert('Select 1 or 2 songs');return;} logEl.textContent=`Downloading ${selected.size} songs...`; for(let i of [...selected]){ await downloadOne(i); await new Promise(r=>setTimeout(r,2000)); } }
function playSelected(){ if(selected.size===0){alert('Select songs');return;} const arr=[...selected]; let idx=0; playSong(arr[idx]); audio.onended=()=>{idx++; if(idx<arr.length) playSong(arr[idx]);}; }
</script>
</body>
</html>
